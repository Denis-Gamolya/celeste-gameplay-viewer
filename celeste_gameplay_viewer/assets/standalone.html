<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celeste gameplay layout</title>
<style>
:root { color-scheme:light dark; --background:light-dark(#fff,#181818); --foreground:light-dark(#222,#eee); --muted:light-dark(#eee,#333); --muted-foreground:light-dark(#666,#aaa); --border:light-dark(#bbb,#555); --purple:light-dark(#874bdf,#be98ff); --blue:light-dark(#1681df,#6db5ff); --red:light-dark(#d22,#ff7777); --green:light-dark(#07813a,#55da91); --orange:light-dark(#bc5700,#ffad65); --yellow:light-dark(#996600,#ffcc44); }
body { margin:20px auto; padding:0 16px; max-width:1100px; font:14px system-ui,sans-serif; color:var(--foreground); background:var(--background); }
.text-small { font-size:12px; }
.text-muted { color:var(--muted-foreground); }
.tabular-nums { font-variant-numeric:tabular-nums; }
.viz-controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
.form-label { display:flex; align-items:center; gap:8px; }
.form-select { font:inherit; padding:6px 10px; max-width:100%; }
</style>
</head>
