<div id="__INSTANCE__">
  <div class="viz-controls">
    <button class="btn" type="button" data-overview>Whole map</button>
    <button class="btn" type="button" data-previous>Previous</button>
    <label class="form-label">View <select class="form-select" data-room></select></label>
    <button class="btn" type="button" data-next>Next</button>
  </div>
  <div class="text-small text-muted" data-status aria-live="polite"></div>
  <div class="viz-controls" aria-label="Image zoom">
    <button class="btn" type="button" data-zoom-out aria-label="Zoom out">−</button>
    <button class="btn" type="button" data-zoom-in aria-label="Zoom in">+</button>
    <button class="btn" type="button" data-fit>Fit</button>
    <button class="btn" type="button" data-actual>100%</button>
    <output class="text-small" data-zoom-status></output>
  </div>
  <div data-viewport tabindex="0" role="region" aria-label="Map image. Drag to pan, pinch or Control-wheel to zoom. Arrow keys scroll.">
    <div data-stage style="position:relative">
      <img data-preview alt="" draggable="false" style="display:block;width:100%;max-width:none;height:auto">
      <div data-regions hidden style="position:absolute;inset:0" role="group" aria-label="Open a room"></div>
    </div>
  </div>
  <style>
    #__INSTANCE__ [data-viewport] {overflow:auto;scrollbar-gutter:stable;max-width:100%;margin-top:8px;touch-action:none;overscroll-behavior:contain;}
    #__INSTANCE__ [data-stage] {user-select:none;}
    #__INSTANCE__ [data-viewport][data-panning] {cursor:grabbing;}
    #__INSTANCE__ [data-region] {position:absolute;margin:0;padding:0;border:0;border-radius:0;background:transparent;min-width:0;min-height:0;}
    #__INSTANCE__ [data-region]:hover {background:color-mix(in srgb,var(--accent, #eef2f7) 22%,transparent);}
  </style>
</div>
<!-- GALLERY_SCRIPT -->
