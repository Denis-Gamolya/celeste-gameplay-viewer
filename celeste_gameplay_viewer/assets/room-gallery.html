<div id="__INSTANCE__">
  <div class="viz-controls">
    <button class="btn" type="button" data-overview>Whole map</button>
    <button class="btn" type="button" data-previous>Previous</button>
    <label class="form-label">View <select class="form-select" data-room></select></label>
    <button class="btn" type="button" data-next>Next</button>
  </div>
  <div class="text-small text-muted" data-status aria-live="polite"></div>
  <div class="viz-controls" aria-label="Image zoom">
    <button class="btn" type="button" data-zoom-out aria-label="Zoom out">−</button>
    <button class="btn" type="button" data-zoom-in aria-label="Zoom in">+</button>
    <button class="btn" type="button" data-fit>Fit</button>
    <button class="btn" type="button" data-actual>100%</button>
    <output class="text-small" data-zoom-status></output>
  </div>
  <div data-viewport tabindex="0" role="region" aria-label="Map image. Drag to pan, pinch or Control-wheel to zoom. Arrow keys scroll.">
    <div data-stage style="position:relative">
      <img data-preview alt="" draggable="false" style="display:block;width:100%;max-width:none;height:auto">
      <div data-regions hidden style="position:absolute;inset:0" role="group" aria-label="Open a room"></div>
    </div>
  </div>
  <style>
    #__INSTANCE__ [data-viewport] {overflow:auto;scrollbar-gutter:stable;max-width:100%;margin-top:8px;touch-action:none;overscroll-behavior:contain;}
    #__INSTANCE__ [data-stage] {user-select:none;}
    #__INSTANCE__ [data-viewport][data-panning] {cursor:grabbing;}
    #__INSTANCE__ [data-region] {position:absolute;margin:0;padding:0;border:0;border-radius:0;background:transparent;min-width:0;min-height:0;}
    #__INSTANCE__ [data-region]:hover {background:color-mix(in srgb,var(--accent, #eef2f7) 22%,transparent);}
  </style>
</div>
<script>
(() => {
  const root = document.getElementById('__INSTANCE__');
  const initialRooms = __ROOM_DATA__;
  let rooms = [];
  let hasLocalSelection = false;
  const select = root.querySelector('[data-room]');
  const previous = root.querySelector('[data-previous]');
  const next = root.querySelector('[data-next]');
  const image = root.querySelector('[data-preview]');
  const status = root.querySelector('[data-status]');
  const overview = root.querySelector('[data-overview]');
  const regions = root.querySelector('[data-regions]');
  const viewport = root.querySelector('[data-viewport]');
  const stage = root.querySelector('[data-stage]');
  const zoomStatus = root.querySelector('[data-zoom-status]');
  const zoomIn = root.querySelector('[data-zoom-in]');
  const zoomOut = root.querySelector('[data-zoom-out]');
  const fitButton = root.querySelector('[data-fit]');
  const actualButton = root.querySelector('[data-actual]');
  let scale = 1;
  let fitMode = true;
  let imageReady = false;
  let suppressClick = false;
  const pointers = new Map();
  const fitScale = () => Math.min(1, viewport.clientWidth / image.naturalWidth);

  function updateZoom() {
    if (!imageReady) return;
    stage.style.width = `${image.naturalWidth * scale}px`;
    image.style.imageRendering = scale >= 1 ? 'pixelated' : 'auto';
    const heightScale = fitMode ? fitScale() : Math.min(scale, 1);
    viewport.style.height = `${Math.min(600, image.naturalHeight * heightScale)}px`;
    zoomStatus.textContent = `${Math.round(scale * 100)}% · ${image.naturalWidth} px`;
    zoomOut.disabled = scale <= fitScale() + 0.0001;
    zoomIn.disabled = scale >= 4;
  }

  function zoomTo(value, anchorX = viewport.clientWidth / 2,
                  anchorY = viewport.clientHeight / 2) {
    if (!imageReady) return;
    const imageX = (viewport.scrollLeft + anchorX) / scale;
    const imageY = (viewport.scrollTop + anchorY) / scale;
    scale = Math.max(fitScale(), Math.min(4, value));
    fitMode = false;
    updateZoom();
    viewport.scrollLeft = imageX * scale - anchorX;
    viewport.scrollTop = imageY * scale - anchorY;
  }

  function fitImage() {
    fitMode = true;
    if (!imageReady) return;
    scale = fitScale();
    updateZoom();
    viewport.scrollLeft = viewport.scrollTop = 0;
  }

  image.addEventListener('load', () => {
    imageReady = true;
    fitButton.disabled = actualButton.disabled = false;
    fitImage();
  });
  fitButton.addEventListener('click', fitImage);
  actualButton.addEventListener('click', () => zoomTo(1));
  zoomIn.addEventListener('click', () => zoomTo(scale * 1.5));
  zoomOut.addEventListener('click', () => zoomTo(scale / 1.5));
  new ResizeObserver(() => {
    if (fitMode) fitImage();
    else if (imageReady) {
      scale = Math.max(scale, fitScale());
      updateZoom();
    }
  }).observe(viewport);

  viewport.addEventListener('wheel', event => {
    if (!event.ctrlKey || !imageReady) return;
    event.preventDefault();
    const bounds = viewport.getBoundingClientRect();
    zoomTo(scale * Math.exp(-event.deltaY * 0.01),
           event.clientX - bounds.left, event.clientY - bounds.top);
  }, {passive: false});

  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !imageReady) return;
    if (pointers.size === 0) suppressClick = false;
    pointers.set(event.pointerId, {
      x: event.clientX, y: event.clientY,
      startX: event.clientX, startY: event.clientY,
    });
  });

  viewport.addEventListener('pointermove', event => {
    const point = pointers.get(event.pointerId);
    if (!point) return;
    const oldPoints = [...pointers.values()].map(item => ({...item}));
    const dx = event.clientX - point.x;
    const dy = event.clientY - point.y;
    point.x = event.clientX;
    point.y = event.clientY;
    if (!suppressClick && pointers.size < 2 &&
        Math.hypot(point.x - point.startX, point.y - point.startY) < 6) return;
    suppressClick = true;
    viewport.dataset.panning = '';
    // Capture only after a drag starts so ordinary room clicks keep their target.
    viewport.setPointerCapture(event.pointerId);
    if (pointers.size === 2) {
      const [beforeA, beforeB] = oldPoints;
      const [afterA, afterB] = [...pointers.values()];
      const oldDistance = Math.hypot(beforeA.x - beforeB.x, beforeA.y - beforeB.y);
      const newDistance = Math.hypot(afterA.x - afterB.x, afterA.y - afterB.y);
      const bounds = viewport.getBoundingClientRect();
      if (oldDistance > 0) {
        zoomTo(scale * newDistance / oldDistance,
               (beforeA.x + beforeB.x) / 2 - bounds.left,
               (beforeA.y + beforeB.y) / 2 - bounds.top);
        viewport.scrollLeft -= dx / 2;
        viewport.scrollTop -= dy / 2;
      }
    } else {
      viewport.scrollLeft -= dx;
      viewport.scrollTop -= dy;
    }
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (pointers.size === 0) delete viewport.dataset.panning;
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('lostpointercapture', endPointer);
  viewport.addEventListener('click', event => {
    if (suppressClick && event.detail !== 0) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
  function loadPages(pages) {
    rooms = pages;
    hasLocalSelection = false;
    select.replaceChildren();
    regions.replaceChildren();
    for (const [index, room] of rooms.entries()) {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = room.name;
      select.append(option);
    }
    const roomPages = new Map(rooms.map((room, index) => [room.name, index]));
    const overviewPage = rooms[0] || {};
    // Smaller rooms win overlaps; equal areas use their original map order.
    const area = region => (region.bounds[2] - region.bounds[0]) * (region.bounds[3] - region.bounds[1]);
    for (const region of [...(overviewPage.regions || [])].sort((a, b) => area(b) - area(a))) {
      const page = roomPages.get(region.room);
      if (!page || rooms[page].kind !== 'room') continue;
      const [left, top, right, bottom] = region.bounds;
      const [width, height] = overviewPage.size;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cursor-interaction';
      button.dataset.region = region.room;
      button.setAttribute('aria-label', `Open ${region.room}`);
      button.setAttribute('data-tooltip', region.room);
      button.style.left = `${left / width * 100}%`;
      button.style.top = `${top / height * 100}%`;
      button.style.width = `${(right - left) / width * 100}%`;
      button.style.height = `${(bottom - top) / height * 100}%`;
      button.addEventListener('click', () => {
        show(page, true);
        // Keep focus on a visible control without opening a mobile select picker.
        overview.focus({preventScroll: true});
      });
      regions.append(button);
    }
  }
  let current = 0;
  function show(index, save = false) {
    const empty = rooms.length === 0;
    select.disabled = empty;
    viewport.hidden = empty;
    imageReady = false;
    zoomIn.disabled = zoomOut.disabled = fitButton.disabled = actualButton.disabled = true;
    zoomStatus.textContent = '';
    if (empty) {
      overview.disabled = previous.disabled = next.disabled = true;
      status.textContent = 'Waiting for map preview…';
      return;
    }
    if (save) hasLocalSelection = true;
    current = Math.max(0, Math.min(rooms.length - 1, index));
    const room = rooms[current];
    select.value = String(current);
    stage.style.width = '100%';
    viewport.scrollLeft = viewport.scrollTop = 0;
    pointers.clear();
    delete viewport.dataset.panning;
    image.src = room.image;
    image.alt = room.kind === 'overview' ? 'Whole-map layout' : `Gameplay layout of ${room.name}`;
    regions.hidden = room.kind !== 'overview';
    overview.disabled = current === 0;
    status.textContent = room.kind === 'overview' ? `Whole map · ${rooms.length - 1} rooms` : `${current} / ${rooms.length - 1} · ${room.name}`;
    previous.disabled = current === 0;
    next.disabled = current === rooms.length - 1;
    if (save && typeof window.openai?.setWidgetState === 'function') {
      // Persistence is optional; synchronous and asynchronous hosts both work.
      try {
        Promise.resolve(window.openai.setWidgetState({
          modelContent: {room: room.name}, privateContent: null,
        })).catch(() => {});
      } catch {
        // A host persistence failure must not interrupt local navigation.
      }
    }
  }
  select.addEventListener('change', () => show(Number(select.value), true));
  previous.addEventListener('click', () => show(current - 1, true));
  next.addEventListener('click', () => show(current + 1, true));
  overview.addEventListener('click', () => show(0, true));
  function restore(state) {
    // Host snapshots hydrate a new gallery, but may arrive after a newer click.
    // Once the user navigates, this gallery owns its selection until replaced.
    if (hasLocalSelection) return;
    const name = state?.modelContent?.room;
    const found = rooms.findIndex(room => room.name === name);
    if (found >= 0) show(found);
  }
  loadPages(initialRooms);
  show(0);
  restore(window.openai?.widgetState);
  root.addEventListener('celeste:pages', event => {
    loadPages(event.detail);
    show(0);
    restore(window.openai?.widgetState);
  });
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    // Height, theme, and display updates are partial, not navigation requests.
    if (state !== undefined) restore(state);
  });
})();
</script>
